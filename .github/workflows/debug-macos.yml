name: Debug macOS 8
on:
  push:
    branches: [task/P.2-platforms]
    paths: [.github/workflows/debug-macos.yml]
permissions:
  contents: read
jobs:
  d:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: list collections
        run: |
          d=$(mktemp -d)
          dist/iglo-base superuser upsert a@b.cc 1234567890 --dir $d/pb_data
          dist/iglo-base serve --dir $d/pb_data --http 127.0.0.1:18095 > $d/log 2>&1 &
          p=$!
          for _ in $(seq 1 100); do c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/api/health || true); [ "$c" = 200 ] && break; sleep 0.1; done
          tok=$(curl -s -X POST -H 'content-type: application/json' -d '{"identity":"a@b.cc","password":"1234567890"}' http://127.0.0.1:18095/api/collections/_superusers/auth-with-password | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "token ${#tok}"
          curl -s -H "Authorization: $tok" http://127.0.0.1:18095/api/collections?perPage=2 | head -c 600; echo
          sleep 2
          curl -s -H "Authorization: $tok" 'http://127.0.0.1:18095/api/logs?perPage=10&sort=-created' | head -c 3000; echo
          kill $p; wait $p || true
          cat $d/log
