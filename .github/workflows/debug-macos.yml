name: Debug macOS 5
on:
  push:
    branches: [task/P.2-platforms]
    paths: [.github/workflows/debug-macos.yml]
permissions:
  contents: read
jobs:
  d:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: shutdown timing
        run: |
          d=$(mktemp -d)
          dist/iglo-base serve --dir $d/pb_data --http 127.0.0.1:18095 > $d/log 2>&1 &
          p=$!
          for _ in $(seq 1 100); do c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/api/health || true); [ "$c" = 200 ] && break; sleep 0.1; done
          sleep 1
          s=$(date +%s)
          kill -TERM $p
          wait $p || true
          echo "stopped after $(( $(date +%s) - s )) s"
          cat $d/log
      - name: tests
        env:
          IGLO_SQLITE_LIB: ${{ github.workspace }}/dist/libsqlite3.dylib
        run: bun test test/logs/log-writer.test.ts test/db/sqlite-lib.test.ts test/cli/serve-bootstrap.test.ts 2>&1 | grep -v '^(pass)' | head -60
