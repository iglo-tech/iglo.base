name: Debug macOS 4
on:
  push:
    branches: [task/P.2-platforms]
    paths: [.github/workflows/debug-macos.yml]
permissions:
  contents: read
jobs:
  d:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: worker probe
        run: |
          bun build --compile --bytecode --format=esm scripts/dbg/m.ts scripts/dbg/w.ts dist/libsqlite3.dylib --outfile dist/dbg
          dist/dbg
