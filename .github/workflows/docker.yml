name: Docker

# Wraps a published server release's executables in one multi-arch image
# (linux/amd64 and linux/arm64, D33, D34) and pushes it to
# ghcr.io/iglo-tech/iglo.base. It ignores non-server releases (such as sdk-v*).
# It never builds iglo.base: it downloads the release archives and SHA256SUMS,
# verifies the checksums, and the Dockerfile copies the executable of each
# architecture in. Each image is smoke-tested on a runner of its own
# architecture before anything is pushed. `workflow_dispatch` with a tag builds
# an existing release. See docs/releasing.md#image.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/iglo-tech/iglo.base

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Release and version
        id: release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $TAG is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
          prerelease="$(gh release view "$TAG" --json isPrerelease,isDraft --jq 'if .isDraft then "draft" else (.isPrerelease | tostring) end')"
          if [ "$prerelease" = draft ]; then
            echo "release $TAG is still a draft" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  smoke:
    needs: release
    name: smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the release executable
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          ARCHES: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/docker-context.sh
      - name: Build
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: docker build --build-arg "VERSION=$VERSION" -f Dockerfile -t "iglo-base:smoke" ctx
      - name: Smoke test
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          test "$(docker run --rm iglo-base:smoke --version)" = "iglo-base version $VERSION"
          docker run -d --name smoke -p 127.0.0.1:18090:8090 iglo-base:smoke
          code=000
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18090/api/health || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          if [ "$code" != 200 ]; then
            docker logs smoke
            echo "/api/health answered $code" >&2
            exit 1
          fi
          docker stop smoke
          status="$(docker inspect smoke --format '{{.State.ExitCode}}')"
          if [ "$status" != 0 ]; then
            docker logs smoke
            echo "docker stop: exit status $status" >&2
            exit 1
          fi

  push:
    needs: [release, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the release executables
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          ARCHES: amd64 arm64
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/docker-context.sh
      # The Dockerfile only copies files, so building the arm64 image needs
      # no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tags="-t $IMAGE:$VERSION"
          # :latest only for the repository's latest published release, so
          # rebuilding an older release never moves it backwards.
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$PRERELEASE" = false ] && [ "$latest" = "$TAG" ]; then
            tags="$tags -t $IMAGE:latest"
          fi
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" -f Dockerfile $tags --push ctx
          docker buildx imagetools inspect "$IMAGE:$VERSION"
