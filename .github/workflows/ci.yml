name: CI

# On demand only (D25): verification is local; CI is not a merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # the "packageManager" field pins the Bun version
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .upstream
          key: upstream-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/differential/upstream.lock') }}
      - run: bun run test:reference

  # linux-arm64 exists only as a GitHub runner, so this job is where that
  # platform is tested (D24, D35). Same commands as `check`; on demand only.
  check-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      # the reference run goes on when `check` failed, so one run reports both
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: .upstream
          key: upstream-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('test/differential/upstream.lock') }}
      - run: bun run test:reference
        if: ${{ !cancelled() }}
