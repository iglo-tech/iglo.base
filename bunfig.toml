# test/differential needs the reference tools in .upstream/, so plain `bun test`
# skips it. `bun run test:reference` runs it after `bun run upstream:prepare`.
[test]
# one temporary root per run, deleted on exit (test/support/temp-root.ts)
preload = ["./test/support/temp-root.ts"]
pathIgnorePatterns = ["test/differential/**", ".upstream/**"]
